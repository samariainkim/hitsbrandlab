<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HITS LAB CANVAS — HITS Brand Lab</title>
<meta name="description" content="이제 당신의 상품을 실험해보세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-nav="canvas">

<div id="site-header-mount"></div>

<section class="canvas-hero">
  <div class="wrap">
    <p class="eyebrow">HITS LAB CANVAS</p>
    <h1>이제 당신의 상품을 실험해보세요.</h1>
    <p>4개의 캔버스로 당신의 상품에 HITS를 대입합니다.</p>
  </div>
</section>

<section class="section section-white">
  <div class="wrap">
    <div class="canvas-grid">
      <div class="canvas-card">
        <p class="canvas-num">01 HOOK</p>
        <p class="canvas-name">Hook Discovery Canvas</p>
        <a href="/canvas/hook/" class="canvas-cta">고객의 진짜 문제 발견하기 →</a>
      </div>
      <div class="canvas-card">
        <p class="canvas-num">02 INSIGHT</p>
        <p class="canvas-name">Insight Canvas</p>
        <a href="/canvas/insight/" class="canvas-cta">팔리는 가치 설계하기 →</a>
      </div>
      <div class="canvas-card">
        <p class="canvas-num">03 TALE</p>
        <p class="canvas-name">Story Canvas</p>
        <a href="/canvas/story/" class="canvas-cta">팔리는 이야기 만들기 →</a>
      </div>
      <div class="canvas-card is-ready">
        <span class="canvas-badge-ready">지금 바로 체험 가능</span><br>
        <p class="canvas-num">04 MASTER</p>
        <p class="canvas-name">HITS Master Canvas</p>
        <a href="/canvas/master/" class="canvas-cta">내 상품의 HITS 완성하기 →</a>
      </div>
    </div>
  </div>
</section>

<div id="site-footer-mount"></div>
<div id="float-newsletter-mount"></div>

<script src="/js/main.js"></script>
</body>
</html>
