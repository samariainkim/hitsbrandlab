<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HITS LIBRARY — HITS Brand Lab</title>
<meta name="description" content="팔리는 상품에는 패턴이 있습니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-nav="library">

<div id="site-header-mount"></div>

<section class="page-header">
  <div class="wrap">
    <p class="eyebrow">HITS LIBRARY</p>
    <h1>팔리는 상품에는 패턴이 있습니다.</h1>
    <p>지금까지 분석한 <span class="count" id="library-count">-</span>개의 HITS</p>
  </div>
</section>

<section class="section section-white">
  <div class="wrap">
    <div class="filter-row" id="case-filters">
      <button class="filter-chip" data-filter="all">전체</button>
      <button class="filter-chip" data-filter="Hook">Hook</button>
      <button class="filter-chip" data-filter="Insight">Insight</button>
      <button class="filter-chip" data-filter="Tale">Tale</button>
      <button class="filter-chip" data-filter="System">System</button>
    </div>
    <div class="case-grid" id="case-grid"></div>
  </div>
</section>

<div id="site-footer-mount"></div>
<div id="float-newsletter-mount"></div>

<script src="/js/main.js"></script>
</body>
</html>
