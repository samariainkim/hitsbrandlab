<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HITS INSIGHT — HITS Brand Lab</title>
<meta name="description" content="상품과 시장을 바라보는 새로운 관점.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-nav="insight">

<div id="site-header-mount"></div>

<section class="page-header">
  <div class="wrap">
    <p class="eyebrow">HITS INSIGHT</p>
    <h1>상품과 시장을 바라보는 새로운 관점</h1>
  </div>
</section>

<section class="section section-white">
  <div class="wrap">
    <input type="text" class="insight-search" placeholder="검색">
    <div class="filter-row" id="insight-filters">
      <button class="filter-chip is-active" data-filter="all">전체</button>
      <button class="filter-chip" data-filter="Trend">Trend</button>
      <button class="filter-chip" data-filter="Consumer">Consumer</button>
      <button class="filter-chip" data-filter="Product">Product</button>
      <button class="filter-chip" data-filter="Brand">Brand</button>
      <button class="filter-chip" data-filter="Commerce">Commerce</button>
    </div>
    <div class="insight-grid" id="insight-grid-mount"></div>
  </div>
</section>

<div id="site-footer-mount"></div>
<div id="float-newsletter-mount"></div>

<script src="/js/main.js"></script>
</body>
</html>
