<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work with HITS — HITS Brand Lab</title>
<meta name="description" content="HITS를 조직과 브랜드에 적용하고 싶다면 함께 이야기해 주세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  .contact-thanks { font-size: 15px; line-height: 1.8; color: var(--text-dark, #111110); padding: 20px 0; }
</style>
</head>
<body data-nav="workwith">

<div id="site-header-mount"></div>

<section class="section section-white">
  <div class="wrap contact-inner">
    <div class="contact-intro">
      <p class="eyebrow eyebrow-dark">WORK WITH HITS</p>
      <h1 class="contact-title">강연 · 기업교육<br>Workshop · Partnership</h1>
      <p class="contact-desc">HITS를 상품과 브랜드에 적용하고 싶다면 함께 이야기해 주세요.<br>담당자가 직접 연락드립니다.</p>
      <p class="contact-email">✉ <a href="mailto:hello@hitsbrandlab.com">hello@hitsbrandlab.com</a></p>
    </div>
    <form class="contact-form" id="contact-form" action="https://formspree.io/f/xwlpkovq" method="POST" target="contact-target">
      <input type="hidden" name="_subject" value="[Work with HITS] 새 문의가 도착했습니다">
      <label>이름/직함 *<input type="text" name="nameTitle" placeholder="name / title" required></label>
      <label>회사명 *<input type="text" name="company" placeholder="Company Name" required></label>
      <label>이메일 *<input type="email" name="email" placeholder="example@email.com" required></label>
      <label>전화번호 *<input type="tel" name="phone" placeholder="tel" required></label>
      <label>문의내용 *<textarea name="inquiry" placeholder="inquiry" rows="5" required></textarea></label>
      <button type="submit" class="btn btn-accent btn-block">문의하기</button>
    </form>
    <iframe name="contact-target" class="newsletter-hidden-frame" title="문의 처리" aria-hidden="true"></iframe>
    <div class="contact-thanks" id="contact-thanks" hidden>
      <p>문의가 정상적으로 접수됐습니다. 빠른 시일 내에 담당자가 입력하신 이메일로 연락드리겠습니다.</p>
    </div>
  </div>
</section>

<div id="site-footer-mount"></div>
<div id="float-newsletter-mount"></div>

<script src="/js/main.js"></script>
</body>
</html>
